name: Build Local App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: ~/VoiceInk-Dependencies
          key: voiceink-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      # Import a stable self-signed identity so macOS TCC grants
      # (Accessibility, Input Monitoring, Screen Recording) survive rebuilds.
      # Ad-hoc signatures change every build, which resets those permissions.
      # Skipped when the secrets are not configured (build stays ad-hoc).
      - name: Import signing certificate
        id: signing
        env:
          SIGNING_CERT_P12: ${{ secrets.LOCAL_SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.LOCAL_SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT_P12" ]; then
            echo "No signing certificate configured; keeping ad-hoc signing."
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/local-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN_PATH" \
            -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          rm "$RUNNER_TEMP/signing.p12"
          echo "identity=VoiceInk Local Signing" >> "$GITHUB_OUTPUT"

      - name: Build unrestricted local app
        run: make local LOCAL_CODESIGN_IDENTITY=- LOCAL_XCODEBUILD_FLAGS='-skipPackagePluginValidation -skipMacroValidation'

      # xcodebuild silently falls back to ad-hoc for identities it does not
      # consider trusted, so re-sign the finished bundle with codesign, which
      # accepts the self-signed identity. --preserve-metadata keeps each nested
      # component's entitlements intact.
      - name: Re-sign with stable identity
        if: steps.signing.outputs.identity != ''
        run: |
          codesign --force --deep --preserve-metadata=entitlements,flags \
            --timestamp=none --sign '${{ steps.signing.outputs.identity }}' \
            "$HOME/Downloads/VoiceInk.app"
          codesign --verify --deep --strict "$HOME/Downloads/VoiceInk.app"
          codesign -dvv "$HOME/Downloads/VoiceInk.app" 2>&1 | grep -E "^Authority|^Signature"
          codesign -dvv "$HOME/Downloads/VoiceInk.app" 2>&1 \
            | grep -q '^Authority=${{ steps.signing.outputs.identity }}$' \
            || { echo "App is not signed with the stable identity"; exit 1; }

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "$HOME/Downloads/VoiceInk.app" VoiceInk-local.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInk-local
          path: VoiceInk-local.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling release for Homebrew
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete local-build --yes --cleanup-tag || true
          gh release create local-build VoiceInk-local.zip \
            --target "$GITHUB_SHA" \
            --title "VoiceInk local build ($(date -u +%Y-%m-%d))" \
            --notes "Unrestricted LOCAL_BUILD from commit $GITHUB_SHA. Install via Homebrew: see BUILDING.md." \
            --latest=false
